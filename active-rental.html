<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SaigonRide - Active Rental</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-container">

        <a href="home.html" class="nav-logo">

            <svg class="nav-icon"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">

                <circle cx="5.5" cy="17.5" r="3.5"/>
                <circle cx="18.5" cy="17.5" r="3.5"/>
                <path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
                <path d="M12 17.5V14l-3-3 4-3 2 3h2"/>
            </svg>

            <span>SaigonRide</span>

        </a>

    </div>
</nav>

<!-- MAIN -->
<main class="main-content">

    <div class="container-md">

        <!-- HEADER -->
        <div class="page-header">

            <h1>Rental In Progress</h1>

            <p>
                Enjoy your ride and return safely 🚲
            </p>

        </div>

        <!-- RENTAL CARD -->
        <div class="card">

            <div class="card-header">

                <h2 class="card-title">
                    Current Rental
                </h2>

                <p class="card-description">
                    Your vehicle is currently active
                </p>

            </div>

            <div class="card-content">

                <!-- STATUS -->
                <div class="status-section">

                    <div class="status-badge-active">
                        ● Active
                    </div>

                </div>

                <!-- VEHICLE -->
                <div class="rental-info-grid">

                    <div class="info-box">

                        <div class="info-label">
                            Vehicle Type
                        </div>

                        <div class="info-value"
                             id="bikeType">
                            Bike
                        </div>

                    </div>

                    <div class="info-box">

                        <div class="info-label">
                            Rental Status
                        </div>

                        <div class="info-value">
                            Running
                        </div>

                    </div>

                </div>

                <!-- START TIME -->
                <div class="start-time-box">

                    <div class="info-label">
                        Started At
                    </div>

                    <div class="start-time-value"
                         id="startTime">
                        --
                    </div>

                </div>

                <!-- END BUTTON -->
                <button class="btn btn-danger btn-full btn-lg"
                        onclick="endRental()">

                    End Rental

                </button>

            </div>

        </div>

    </div>

</main>

<!-- FOOTER -->
<footer class="footer">

    <p>
        © 2026 SaigonRide - Smart Vehicle Rental System
    </p>

    <p class="footer-subtitle">
        Eco-friendly mobility for everyone
    </p>

</footer>

<style>

.status-section{
    margin-bottom:24px;
}

.status-badge-active{
    display:inline-block;
    padding:8px 16px;
    background:#dcfce7;
    color:#16a34a;
    border-radius:999px;
    font-weight:600;
    font-size:14px;
}

.rental-info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:24px;
}

.info-box{
    background:#f9fafb;
    padding:20px;
    border-radius:16px;
    text-align:center;
}

.info-label{
    color:#6b7280;
    font-size:14px;
    margin-bottom:8px;
}

.info-value{
    font-size:20px;
    font-weight:700;
    color:#111827;
}

.start-time-box{
    background:#eff6ff;
    border-radius:16px;
    padding:24px;
    text-align:center;
    margin-bottom:24px;
}

.start-time-value{
    font-size:28px;
    font-weight:700;
    color:#2563eb;
}

.btn-danger{
    background:#ef4444;
    color:white;
}

.btn-danger:hover{
    background:#dc2626;
}

</style>

<script>

document.addEventListener(
    "DOMContentLoaded",
    loadRental
);

async function loadRental() {

    const rentalId =
        localStorage.getItem("rentalId");

    const res = await fetch(
        "https://localhost:7065/api/rental"
    );

    const rentals = await res.json();

    const rental =
        rentals.find(r => r.id == rentalId);

    if (!rental) {

        alert("Rental not found");

        return;
    }

    document.getElementById("bikeType")
        .textContent = rental.bikeType;

    document.getElementById("startTime")
        .textContent =
            new Date(rental.startTime)
                .toLocaleTimeString();
}

async function endRental() {

    const rentalId =
        localStorage.getItem("rentalId");

    const res = await fetch(
        `https://localhost:7065/api/rental/end/${rentalId}`,
        {
            method: "POST"
        });

    if (!res.ok) {

        const error = await res.text();

        alert(error);

        return;
    }

    const rental = await res.json();

    localStorage.removeItem("activeRental");

    localStorage.setItem(
        "totalPrice",
        Math.round(rental.totalPrice)
    );

    localStorage.setItem(
        "pendingPayment",
        "true"
    );

    window.location.href =
        "payment.html";
}

</script>

</body>
</html>
