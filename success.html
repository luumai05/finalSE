<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#00b894,#00cec9);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .success-card{
            background:white;
            padding:50px;
            border-radius:20px;
            text-align:center;
            width:400px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            animation:fadeIn 0.5s ease;
        }

        .success-icon{
            font-size:80px;
            margin-bottom:20px;
        }

        h1{
            color:#00b894;
            margin-bottom:10px;
        }

        p{
            color:#555;
            margin-bottom:30px;
            line-height:1.5;
        }

        .btn{
            display:inline-block;
            padding:12px 24px;
            background:#00b894;
            color:white;
            text-decoration:none;
            border-radius:10px;
            transition:0.3s;
            font-weight:bold;
        }

        .btn:hover{
            background:#019875;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

    </style>

</head>

<body>

<div class="success-card">

    <div class="success-icon">
        ✅
    </div>

    <h1>Payment Successful!</h1>

    <p>
        Thank you for using SaigonRide.<br>
        Your rental has been completed successfully.
    </p>

    <a href="home.html" class="btn">
        Back to Home
    </a>

</div>

</body>
</html>
